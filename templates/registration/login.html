<!DOCTYPE html>
{% load static %}
{% load crispy_forms_tags %}
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión - Secreto helado</title>
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        body { background: #f8f9fa; }
        .brand { font-weight: 700; color: #0d6efd; }
        .card-login { border: none; border-radius: 12px; box-shadow: 0 6px 18px rgba(13,110,253,0.08); }
        .input-group-text { background: transparent; border-right: 0; }
        .form-control { border-left: 0; }
        .btn-primary { background-color: #0d6efd; border-color: #0d6efd; }
        .container-login {
            min-height: calc(100vh - 112px);
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-light shadow-sm">
        <div class="container">
            <a class="navbar-brand brand" href="{% url 'index' %}">🍦 Secreto helado</a>
            <div></div>
        </div>
    </nav>

    <div class="container-login">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-4">
                    <div class="card card-login">
                        <div class="card-body p-4">
                            <h5 class="card-title text-center mb-3">Inicio de Sesión</h5>
                            <hr>
                            {% if form.errors %}
                                <div class="alert alert-danger" role="alert">
                                    <strong>Error:</strong> Usuario o contraseña incorrectos. Por favor, inténtalo de nuevo.
                                </div>
                            {% endif %}
                            <form method="post" action="{% url 'login' %}">
                                {% csrf_token %}
                                {{ form | crispy }}
                                <input type="hidden" name="next" value="{{ next }}" />
                                <div class="d-flex gap-2 mt-3">
                                    <a href="{% url 'index' %}" class="btn btn-secondary flex-fill">Cancelar</a>
                                    <input type="submit" value="Ingresar" class="btn btn-primary flex-fill">
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 Heladería Secreto Helado</p>
    </footer>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
