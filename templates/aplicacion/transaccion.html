<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Transaccional</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="bg-light py-5 text-center">
        <div class="container">
            <h1 class="display-5 fw-bold text-primary">Sistema Transaccional</h1>
            <p class="lead text-secondary mb-4">Registra transacciones aplicando promociones y sumando puntos a los clientes.</p>
        </div>
    </header>

    <div class="container mt-5">
        <!-- Formulario para registrar transacciones -->
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title text-primary">Registrar Transacción</h5>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="formulario" value="registrar_transaccion"> <!-- Identificador del formulario -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cliente" class="form-label">Seleccionar Cliente</label>
                            <select name="cliente" id="cliente" class="form-select" required>
                                <option value="">Seleccione un cliente</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.run }}">{{ cliente.nombre }} {{ cliente.apellido_paterno }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="promocion" class="form-label">Seleccionar Promoción</label>
                            <select name="promocion" id="promocion" class="form-select" required>
                                <option value="">Seleccione una promoción</option>
                                {% for promocion in promociones %}
                                <option value="{{ promocion.id }}">{{ promocion.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="producto" class="form-label">Seleccionar Producto</label>
                            <select name="producto" id="producto" class="form-select" required>
                                <option value="">Seleccione un producto</option>
                                {% for producto in productos %}
                                <option value="{{ producto.id }}">{{ producto.nombre }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-dark" href="{% url 'inicio' %}">Ir al inicio</a>
                        <button type="submit" class="btn btn-primary">Registrar Transacción</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Formulario para actualizar puntos -->
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title text-primary">Actualizar Puntos del Cliente</h5>
                <form method="POST">
                    {% csrf_token %}
                    <input type="hidden" name="formulario" value="actualizar_puntos"> <!-- Identificador del formulario -->
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="cliente_puntos" class="form-label">Seleccionar Cliente</label>
                            <select name="cliente_puntos" id="cliente_puntos" class="form-select" required>
                                <option value="">Seleccione un cliente</option>
                                {% for cliente in clientes %}
                                <option value="{{ cliente.run }}">{{ cliente.nombre }} {{ cliente.apellido_paterno }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="puntos" class="form-label">Puntos a Sumar/Restar</label>
                            <input type="number" name="puntos" id="puntos" class="form-control" placeholder="Ej: +10 o -10" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a class="btn btn-dark" href="{% url 'inicio' %}">Ir al inicio</a>
                        <button type="submit" class="btn btn-success">Actualizar Puntos</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2025 Heladería Secreto Helado</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
